<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoprint</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
    <link rel="apple-touch-icon" href="images/favicon-192.png" />

    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css?v=5.3.8" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.css?v=1.13.2" />

    <!-- Thème Radzen « standard » (B77) : met en forme la page pendant le chargement de Blazor (B29), puis <RadzenTheme> prend le relais -->
    <link id="theme" rel="stylesheet" href="_content/Radzen.Blazor/css/standard-base.css">
    <link rel="stylesheet" href="css/app.css?v=16" />
    <!-- Charte graphique Autoprint (Docs/Charte-graphique/livrables) : jetons --ap-* et surcharge des variables Radzen -->
    <link rel="stylesheet" href="css/autoprint-theme.css?v=3" />
    <!-- Fichiers de l'application suffixés ?v=N : à augmenter à chaque modification, sinon le navigateur garde l'ancienne version en cache -->
    <!-- Avant le rendu : applique le thème sombre mémorisé pour éviter un flash clair -->
    <script src="js/theme-init.js?v=1"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="" class="reload">Recharger</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="lib/bootstrap/js/bootstrap.bundle.min.js?v=5.3.8"></script>

    <script src="lib/chartjs/chart.umd.js?v=4.6.1"></script>
    <script src="js/app.js?v=5"></script>

    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
