# Mises à jour automatiques des dépendances (audit 2026-11, phase 3)
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Les packages Microsoft évoluent ensemble (même version 10.0.x)
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
