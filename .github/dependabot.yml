# Mises à jour automatiques des dépendances (audit 2026-11, phase 3)
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Les packages Microsoft évoluent ensemble (même version 10.0.x)
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
    ignore:
      # PDFsharp 6.5+ passe de MIT à AGPL-3.0 avec contrôle de licence (refus de générer les PDF) :
      # rester en 6.2.x tant que la décision n'est pas prise (backlog B42)
      - dependency-name: "PDFsharp"
        versions: [">= 6.3.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
